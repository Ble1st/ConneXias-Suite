# ⏸ PAUSIERT (2026-08-27): s. Banner-Kommentar in src/*.rs bzw. rust/Cargo.tomls members-Kommentar
# für den vollen Kontext. Diese Crate ist aktuell nicht Mitglied des rust/-Workspace.

[package]
name = "connexias-barbican"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "connexias_barbican"

# uniffi-bindgen als eigenes Bin-Target im selben Crate — identisches Muster zu
# rust/engine/Cargo.toml (s. dortiger Kommentar).
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[dependencies]
uniffi = "0.32"
# Virtueller TCP/IP-Stack für den NAT-Teil (nat.rs) — terminiert App-seitige TCP/UDP-Verbindungen
# innerhalb des Tunnels korrekt (Retransmission/Fenster/RST-Handling), statt eine eigene,
# fehleranfällige TCP-Implementierung zu schreiben. `std`, weil dieser Code (anders als typische
# smoltcp-Einsätze auf Embedded-Zielen) in einem normalen Android-Prozess mit Threads/Sockets
# läuft, kein no_std-Ziel.
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }

[features]
uniffi-cli = ["uniffi/cli"]

[dev-dependencies]
