[workspace]
resolver = "3"
# "engine" (Krypto) + "barbican" (Netz-Sperre, 2026-08-27) — anders als im ConneXias-Framework-
# Quellprojekt bewusst als Warden-internes Feature statt eines zweiten APKs portiert (Warden ist
# single-Gradle-module, kein Sinn für die Cross-APK-AIDL/Broadcast-Komplexität des Quellprojekts).
# "archive" (Steward) bleibt weiterhin bewusst nicht Teil dieses Projekts.
members = ["engine", "barbican"]

[workspace.package]
edition = "2024"
rust-version = "1.90"

# Reproduzierbare Builds, `cargo build --locked`. Cargo.lock wird bewusst NICHT gitignored
# (Gegenteil der üblichen Library-Konvention, hier aber gewollt: die Engine wird als
# Workspace-Library direkt in die App gelinkt, nicht auf crates.io veröffentlicht).
[profile.release]
lto = true
strip = true
