[workspace]
resolver = "3"
# "engine" (Krypto) bleibt Workspace-Mitglied. "barbican" ("Netz-Sperre", 2026-08-27) war
# kurzzeitig auch Mitglied, ist aber seit demselben Tag wieder entfernt: Live-Test fand nach
# mehreren echten Bugfixes (s. app-seitigen Commit 7252396 und das Memo
# warden-netzsperre-feature-2026-08-27) einen ungeklärten Kernfehler (DNS-Blockliste/NAT-Relay
# verarbeitet auf einem frisch aufgebauten Tunnel keinen Traffic mehr). Die Crate selbst bleibt
# unter rust/barbican/ liegen (jede Quelldatei dort trägt einen eigenen Pausiert-Banner-Kommentar),
# ist aber dadurch nicht mehr Teil von `cargo build`/`cargo test` von hier aus. "archive" (Steward)
# bleibt weiterhin bewusst nicht Teil dieses Projekts.
members = ["engine"]

[workspace.package]
edition = "2024"
rust-version = "1.90"

# Reproduzierbare Builds, `cargo build --locked`. Cargo.lock wird bewusst NICHT gitignored
# (Gegenteil der üblichen Library-Konvention, hier aber gewollt: die Engine wird als
# Workspace-Library direkt in die App gelinkt, nicht auf crates.io veröffentlicht).
[profile.release]
lto = true
strip = true
