[versions]
agp = "9.3.2"
kotlin = "2.3.20"
coreKtx = "1.19.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.0"
coil = "3.6.1"
media3 = "1.11.0"
camerax = "1.5.1"
exifinterface = "1.4.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Volles Icon-Set (Icons.Filled.FlashOn/FlashOff/Timer/CameraFront/...) statt nur material-icons-core
# — dieselbe Begründung wie in ConneXias Files, ein Kamera-UI braucht durchgängig verschiedene Icons.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# Kurz-Ansicht der letzten Aufnahme (ui/review/): lädt aus MediaStore-content://-Uris — Coil 3
# statt Glide/Picasso, dieselbe Wahl wie ConneXias Files (reine Compose-API, kein View-Interop).
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
# Video-Kurzwiedergabe in der Review: Media3 ist AndroidX/Google-OSS (kein Play-Services-Dienst) —
# erfüllt die "kein Play Services/keine proprietären Google-Dienste"-Vorgabe.
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
# CameraX: AndroidX/Google-OSS (kein Play-Services-Dienst, anders als der alte camera2-freie
# "GmsCore CameraX"-Mythos — die hier verwendeten Artefakte liegen alle unter androidx.camera und
# haben keine Play-Services-Laufzeitabhängigkeit), erspart die deutlich fehleranfälligere direkte
# Camera2-API-Nutzung (Sessions/CaptureRequests von Hand verwalten).
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-camera-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }
# HDR: läuft über die vom Gerätehersteller im Camera2-HAL bereitgestellte "Extension" (Vendor-
# Implementierung, kein Google-Cloud-/Play-Services-Dienst) — AndroidX-Artefakt, erfüllt dieselbe
# FOSS-Vorgabe wie die übrigen camerax-Artefakte. Auf Geräten ohne HDR-Extension bleibt der
# HDR-Umschalter einfach ausgegraut (Laufzeit-Verfügbarkeitsprüfung, s. CameraController).
androidx-camera-extensions = { group = "androidx.camera", name = "camera-extensions", version.ref = "camerax" }
# EXIF-Rotation vor dem Filtern auslesen/anwenden (PhotoFilterSaver) — dieselbe Bibliothek/
# Begründung wie in ConneXias Galerie (util/PhotoEditor.kt).
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Kein org.jetbrains.kotlin.android: AGP 9+ bringt Kotlin-Support fest eingebaut mit und
# untersagt das separate Plugin (https://kotl.in/gradle/agp-built-in-kotlin).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
