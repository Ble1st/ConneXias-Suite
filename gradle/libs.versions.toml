[versions]
agp = "9.3.1"
kotlin = "2.3.20"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
androidxTestRules = "1.7.0"
appcompat = "1.7.1"
material = "1.14.0"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
jna = "5.19.1"
timber = "5.0.1"
biometric = "1.1.0"
workManager = "2.11.2"
lifecycle = "2.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Icons.AutoMirrored.Filled.ArrowBack (App-Verwaltung/Sicherheits-Scanner-Screens, portiert aus
# Herald) — Basis-Icon-Set, von material3 nicht automatisch mitgezogen.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# @aar-Classifier: JNA bündelt so seine architekturspezifischen Nativ-Bibliotheken korrekt für
# Android (UniFFIs generierte Kotlin-Bindings brauchen com.sun.jna.* zur Laufzeit).
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
# Timber-Fassade vor LocalRingTree/HashChainLogStore (crypto.LocalRingTree extends Timber.Tree).
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
# BiometricPrompt für den Presence-Nachweis (PresenceManager).
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }
# WardenLock (App-Eintritts-Gate): ProcessLifecycleOwner erkennt App-weites Backgrounding, um
# WardenLockSession zu invalidieren — unterscheidet "App verlassen" von reiner Navigation
# zwischen Wardens eigenen Activities (WardenLockSession-Klassendoc).
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Kein org.jetbrains.kotlin.android: AGP 9+ bringt Kotlin-Support fest eingebaut mit und
# untersagt das separate Plugin (https://kotl.in/gradle/agp-built-in-kotlin).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
