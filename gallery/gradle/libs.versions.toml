[versions]
agp = "9.3.2"
kotlin = "2.3.20"
coreKtx = "1.19.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.0"
coil = "3.6.1"
media3 = "1.11.0"
mockito = "5.23.0"
okhttp = "5.5.0"
securityCrypto = "1.1.0"
exifinterface = "1.4.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Volles Icon-Set (Icons.Filled.PhotoLibrary/Delete/Share/SelectAll/...) statt nur
# material-icons-core — dieselbe Begründung wie in ConneXias Files.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# Bildbetrachter/Thumbnail-Grid: lädt MediaStore-content://-Uris — Coil 3 statt Glide/Picasso,
# dieselbe Wahl wie ConneXias Files (reine Compose-API/AsyncImage, kein View-Interop).
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
# Videoplayer: Media3 ist AndroidX/Google-OSS (kein Play-Services-Dienst) — erfüllt die
# "kein Play Services/keine proprietären Google-Dienste"-Vorgabe, s. README.
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
# Bucket-/Sortier-Unit-Tests brauchen ein android.net.Uri-Objekt (MediaItem.uri) rein als
# Platzhalter-Referenz (nie inhaltlich ausgewertet) — der Android-Stub-JAR wirft bei jedem
# echten Uri.parse()/.EMPTY-Aufruf, ein Mockito-Mock genügt hier als reiner Werthalter.
mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
# Cloud-Sync (data/webdav/): schlanker eigener WebDAV-Client statt einer Sync-Bibliothek/eines
# proprietären Cloud-SDKs — dieselbe Wahl wie ConneXias Files' WebDavClient.kt.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Verschlüsselte Ablage der WebDAV-Zugangsdaten (data/webdav/WebDavAccountStore.kt) — dieselbe
# Wahl wie ConneXias Files, weil hier (anders als beim Rest der App) tatsächlich ein Passwort
# abgelegt wird.
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
# PhotoEditor: liest die EXIF-Rotation des Originals, damit ein bearbeitetes Foto nicht seitwärts
# gespeichert wird (BitmapFactory ignoriert EXIF-Orientation beim Decodieren selbst) — AndroidX/FOSS,
# kein Play-Services-Bezug.
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Kein org.jetbrains.kotlin.android: AGP 9+ bringt Kotlin-Support fest eingebaut mit und
# untersagt das separate Plugin (https://kotl.in/gradle/agp-built-in-kotlin).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
