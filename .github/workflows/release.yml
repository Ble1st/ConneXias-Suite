name: Release

# Per Git-Tag (vX.Y.Z) oder manuell über "Run workflow" auf der GitHub-Weboberfläche. Im manuellen
# Fall wird die nächste Version automatisch aus dem letzten vX.Y.Z-Tag berechnet (Bump-Stufe per
# Dropdown) und der neue Tag von der Pipeline selbst gesetzt und gepusht — kein manuelles Taggen
# nötig. Baut die Rust-Crypto-Engine für alle vier Android-ABIs frisch aus der Quelle (statt den
# im Repo committeten jniLibs/Kotlin-Bindings zu vertrauen, s. rust/build-android.sh) und erst
# danach die signierte Release-APK.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Versions-Bump ab dem letzten vX.Y.Z-Tag (automatische Versionierung)"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  # Wiederverwendet exakt dieselben Checks wie CI (Rust fmt/clippy/test, Android lint/Unit-Tests/
  # assembleDebug) als Quality-Gate — muss grün sein, bevor überhaupt ein Release-Build (und im
  # manuellen Fall: eine Tag-Erstellung) stattfindet.
  checks:
    uses: ./.github/workflows/ci.yml

  build-release:
    name: Build & sign release APK
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version (bei manuellem Trigger automatisch bumpen + taggen)
        id: tag
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$TAG' entspricht nicht dem erwarteten Schema vMAJOR.MINOR.PATCH"
              exit 1
            fi
          else
            LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
            LATEST_TAG="${LATEST_TAG:-v0.0.0}"
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              *) echo "::error::Unbekannte Bump-Stufe '$BUMP'"; exit 1 ;;
            esac
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
            echo "Letzter Tag: $LATEST_TAG, Bump: $BUMP -> neuer Tag: $TAG"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compute versionName/versionCode
        id: version
        run: |
          VERSION_NAME="${{ steps.tag.outputs.tag }}"
          VERSION_NAME="${VERSION_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # --- Komplette Rust-Kette: Engine frisch für alle 4 Android-ABIs aus der Quelle bauen ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: warden/rust

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build connexias-engine (jniLibs + Kotlin bindings)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./build-android.sh
        working-directory: warden/rust

      - name: Check generated Kotlin bindings for drift
        run: |
          if ! git diff --quiet -- warden/app/src/main/java/uniffi/connexias_engine/connexias_engine.kt warden/sentinel/src/main/java/uniffi/connexias_engine/connexias_engine.kt; then
            echo "::warning::Frisch generierte UniFFI-Kotlin-Bindings weichen vom committeten Stand ab (app/ und/oder sentinel/) — rust/build-android.sh lokal laufen lassen und Ergebnis committen."
          fi

      # --- Android-Release-Build ---
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Baut :app UND :sentinel (":app:assembleRelease" hängt bereits transitiv von
      # ":sentinel:assembleRelease" ab — app/build.gradle.kts' copySentinelApkFor<Variant>-Task,
      # s. dessen Kommentar) — ein einziger Gradle-Aufruf genügt, kein separater Sentinel-Schritt
      # nötig. Beide Module lesen dieselben WARDEN_RELEASE_STORE_*-Env-Vars (Pflicht für die
      # signature-Permission-Kopplung, s. sentinel/build.gradle.kts-Kommentar).
      - name: Assemble release APKs (Warden + Sentinel)
        env:
          WARDEN_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          WARDEN_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          WARDEN_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          WARDEN_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        working-directory: warden
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PwardenVersionName=${{ steps.version.outputs.name }} \
            -PwardenVersionCode=${{ steps.version.outputs.code }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: warden-${{ steps.version.outputs.name }}
          path: warden/app/build/outputs/apk/release/*.apk
          retention-days: 90

      # Sentinels rohe APK zusätzlich als eigenständiges Artefakt/Release-Asset — nicht nur
      # eingebettet in Wardens assets/sentinel.apk (Plan-Abschnitt "Build/Release") — für
      # unabhängige Prüfbarkeit (z. B. Zertifikatsvergleich gegen Wardens APK) und Runbook-Zwecke
      # (manuelle Neuinstallation ohne einen laufenden Warden, s. MANUAL_SMOKE_TEST.md).
      - name: Upload Sentinel APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-${{ steps.version.outputs.name }}
          path: warden/sentinel/build/outputs/apk/release/*.apk
          retention-days: 90

      # F-4-Folgearbeit (R8 seit 2026-08-25 aktiv): R8s Obfuskierung ist pro Build einzigartig
      # (kein -applymapping) — ohne mapping.txt aus genau diesem Build ist ein späterer Crash-
      # Report (Nutzer meldet Zeile+umbenannten Klassennamen, s. proguard-rules.pro-Kommentar zu
      # SourceFile/LineNumberTable) für diese Version nicht mehr zurückübersetzbar. Bewusst nur
      # als CI-Artefakt (Maintainer-Zugriff über den Actions-Run), nicht als Anhang der
      # öffentlichen GitHub-Release-Seite unten — kein Geheimnis, aber auch kein Nutzer-Download.
      - name: Upload R8 mapping (Crash-Deobfuskierung für diese Version)
        uses: actions/upload-artifact@v7
        with:
          name: warden-${{ steps.version.outputs.name }}-mapping
          path: warden/app/build/outputs/mapping/release/
          retention-days: 365

      # :sentinel hat R8 seit demselben Milestone ebenfalls aktiv (sentinel/build.gradle.kts) —
      # dieselbe Begründung wie oben, eigenes mapping.txt pro Modul.
      - name: Upload Sentinel R8 mapping (Crash-Deobfuskierung für diese Version)
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-${{ steps.version.outputs.name }}-mapping
          path: warden/sentinel/build/outputs/mapping/release/
          retention-days: 365

      # Prüfsummen + Signaturzertifikat für den Sideload-Weg — s. ausführliche Begründung in
      # release-apps.yml. Bei Warden kommt ein zweiter Grund dazu: Sentinel **muss** dasselbe
      # Zertifikat tragen wie :app (signature-geschützte Permission, s. sentinel/build.gradle.kts).
      # Der Fingerabdruck wird deshalb für beide APKs ermittelt und verglichen — stimmen sie nicht
      # überein, bricht der Release-Bau ab, statt ein Paar zu veröffentlichen, das sich auf dem
      # Gerät gegenseitig nicht erkennt.
      - name: Prüfsummen und Zertifikat-Fingerabdruck
        id: checksums
        run: |
          set -euo pipefail
          cd warden
          app_apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          sentinel_apk=$(ls sentinel/build/outputs/apk/release/*.apk | head -n1)

          sha256sum "$app_apk" "$sentinel_apk" | sed 's|.*/||' > "$RUNNER_TEMP/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/SHA256SUMS.txt"

          print_fingerprint() {
            keytool -printcert -jarfile "$1" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//'
          }
          app_fp=$(print_fingerprint "$app_apk")
          sentinel_fp=$(print_fingerprint "$sentinel_apk")
          if [ "$app_fp" != "$sentinel_fp" ]; then
            echo "::error::Warden und Sentinel tragen unterschiedliche Signaturzertifikate."
            echo "  Warden:   $app_fp"
            echo "  Sentinel: $sentinel_fp"
            exit 1
          fi
          echo "fingerprint=$app_fp" >> "$GITHUB_OUTPUT"

      - name: Release-Text zusammenstellen
        run: |
          {
            echo "## Installation"
            echo
            echo "Sideload — kein Play Store, keine Google-Play-Dienste. Warden wird zusätzlich"
            echo "als Device Owner eingerichtet; die Sentinel-APK bringt Warden selbst mit und"
            echo "liegt hier nur zur unabhängigen Prüfung und für die manuelle Neuinstallation bei."
            echo
            echo "## Dateien prüfen"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt          # Dateien unverändert?"
            echo "keytool -printcert -jarfile *.apk    # von wem signiert?"
            echo '```'
            echo
            echo "Erwarteter Zertifikat-Fingerabdruck (SHA256) — für Warden und Sentinel identisch"
            echo "(im Release-Bau geprüft) und derselbe wie bei Files, Kamera und Galerie:"
            echo
            echo '```'
            echo "${{ steps.checksums.outputs.fingerprint }}"
            echo '```'
            echo
            echo "## Updates"
            echo
            echo "Warden prüft nicht selbst auf Updates. Neue Versionen stehen auf dieser"
            echo "Releases-Seite; der Über-Bildschirm der App verlinkt sie direkt. Ein Update wird"
            echo "über die neue APK installiert, Daten und Einstellungen bleiben erhalten — der"
            echo "Device-Owner-Status ebenfalls, solange das Zertifikat dasselbe ist."
          } > "$RUNNER_TEMP/release-body.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Warden ${{ steps.version.outputs.name }}
          draft: true
          body_path: ${{ runner.temp }}/release-body.md
          # Hängt die von GitHub aus den Commits/PRs seit dem letzten Tag erzeugte Liste unter
          # den festen Teil oben. Bewusst statt einer handgepflegten CHANGELOG.md: die
          # App-READMEs führen die inhaltliche Historie ohnehin chronologisch (und zwar nach
          # Befund, nicht nach Release), eine dritte Liste daneben wäre die erste, die veraltet.
          # Was auf einer Release-Seite fehlte, war die Antwort auf "was ist seit meiner Version
          # passiert" — genau das erzeugt GitHub hier automatisch und immer vollständig.
          generate_release_notes: true
          files: |
            warden/app/build/outputs/apk/release/*.apk
            warden/sentinel/build/outputs/apk/release/*.apk
            ${{ runner.temp }}/SHA256SUMS.txt
