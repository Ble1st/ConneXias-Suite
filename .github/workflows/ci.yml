name: CI

# Läuft bei jedem Push auf main (main ist geschützt, das sind praktisch nur Merges), bei jedem PR
# gegen main und manuell über "Run workflow" auf der GitHub-Weboberfläche (für einen beliebigen
# Branch). `workflow_call` erlaubt release.yml, exakt dieselben Checks als Quality-Gate vor dem
# Release-Bau wiederzuverwenden, statt sie zu duplizieren.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust engine (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warden/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: warden/rust

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  android:
    name: Android (lint, unit tests, assembleDebug) — ${{ matrix.module }}
    runs-on: ubuntu-latest
    # Matrix statt vier separater Jobs: alle vier Apps sind unabhängige Gradle-Root-Projekte mit
    # identischem Check-Ablauf (lint/testDebugUnitTest/assembleDebug) — bis 2026-09-02 lief das
    # hier nur für warden, Camera/Files/Gallery konnten auf main kaputtgehen, ohne dass CI es
    # gemerkt hätte (s. analyse.md Abschnitt 5/6).
    strategy:
      fail-fast: false
      matrix:
        module: [warden, files, camera, gallery]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/app/build/reports/lint-results-*.html
            ${{ matrix.module }}/app/build/reports/tests/
            ${{ matrix.module }}/sentinel/build/reports/lint-results-*.html
            ${{ matrix.module }}/sentinel/build/reports/tests/
          retention-days: 14
