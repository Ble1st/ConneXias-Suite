[workspace]
resolver = "3"
# "engine" (Krypto) bleibt Workspace-Mitglied. "barbican" ("Netz-Sperre") ist
# seit 2026-08-29 wieder aktiviert - Kernfehler (DNS-Blockliste/NAT-Relay verarbeitet keinen
# Traffic) wurde behoben durch Polling-Reihenfolge-Fix in engine.rs.
members = ["engine", "barbican"]

[workspace.package]
edition = "2024"
rust-version = "1.90"

# Reproduzierbare Builds, `cargo build --locked`. Cargo.lock wird bewusst NICHT gitignored
# (Gegenteil der üblichen Library-Konvention, hier aber gewollt: die Engine wird als
# Workspace-Library direkt in die App gelinkt, nicht auf crates.io veröffentlicht).
[profile.release]
lto = true
strip = true
