[package]
name = "connexias-barbican"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "connexias_barbican"

# uniffi-bindgen als eigenes Bin-Target im selben Crate — identisches Muster zu
# rust/engine/Cargo.toml (s. dortiger Kommentar).
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[dependencies]
uniffi = "0.32"
# Virtueller TCP/IP-Stack für den NAT-Teil (nat.rs) — terminiert App-seitige TCP/UDP-Verbindungen
# innerhalb des Tunnels korrekt (Retransmission/Fenster/RST-Handling), statt eine eigene,
# fehleranfällige TCP-Implementierung zu schreiben. `std`, weil dieser Code (anders als typische
# smoltcp-Einsätze auf Embedded-Zielen) in einem normalen Android-Prozess mit Threads/Sockets
# läuft, kein no_std-Ziel.
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
# ChildVPN (2026-08-31, docs/design-barbican-prozess-childvpn.md): reine Userspace-WireGuard-
# Implementierung (Cloudflare) für den optionalen zweiten Tunnel zur eigenen VPS — `default = []`
# in boringtuns eigenem Cargo.toml (verifiziert gegen den echten Quellcode v0.7.1), eine
# Dependency ohne Extra-Features kompiliert deshalb nur das `noise`-Modul + den `x25519`-Re-Export,
# nicht die für uns unnötigen `device`/`ffi-bindings`/`jni-bindings`-Extras.
boringtun = "0.7"
# Bereits transitiv über boringtun vorhanden (`cargo tree -p connexias-barbican -i nix` -> nix
# v0.31.3), hier ohne Zusatzkosten als direkte Abhängigkeit hinzugefügt: `engine.rs`s Lese-Thread
# braucht `poll()` mit Timeout statt eines unbegrenzt blockierenden `File::read()` (s. dortiger
# Kommentar am Lese-Thread — 2026-08-31, Root-Ursache für geleakte Reader-Threads nach
# disarm/rearm-Zyklen unter Always-On+Lockdown-VPN). `default-features = false` + nur `poll`, da
# sonst ungenutzte nix-Module (z. B. `signal`, `process`) mitkompiliert würden.
nix = { version = "0.31", default-features = false, features = ["poll"] }
# `libc::close` zum sicheren Schließen von fds ohne Double-Close-UB (s. engine.rs).
libc = "0.2"

[features]
uniffi-cli = ["uniffi/cli"]

[dev-dependencies]
